
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu - Projeto Integrador</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f4f8;
            color: #222;
            transition: 0.3s;
        }

        .menu {
            width: 100%;
            padding: 20px;
            background: #ffffff;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.10);
            text-align: center;
            transition: 0.3s;
        }
        .menu h1 {
            margin: 0 0 8px;
            color: #222;
            font-size: 28px;
        }

        .menu h2 {
            margin: 0 0 8px;
            color: #555;
            font-size: 20px;
            font-weight: 500;
        }

        .menu h3 {
            margin: 0 0 20px;
            color: #24436b;
            font-size: 17px;
            font-weight: 500;
        }

        .links {
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .links a {
            flex: 1;
            max-width: 300px;
            padding: 13px;
            border-radius: 8px;
            background: #e9eef7;
            color: #24436b;
            text-decoration: none;
            transition: 0.3s;
        }

        .links a:hover {
            background: #24436b;
            color: #ffffff;
        }

        .botao-tema {
            position: fixed;
            top: 15px;
            right: 15px;
            padding: 10px 16px;
            border: none;
            border-radius: 8px;
            background: #24436b;
            color: white;
            font-size: 14px;
            cursor: pointer;
            z-index: 10;
        }

        .botao-tema:hover {
            opacity: 0.85;
        }

        body.modo-noturno {
            background: #121212;
            color: #ffffff;
        }

        body.modo-noturno .menu {
            background: #1e1e1e;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
        }

        body.modo-noturno .menu h1 {
            color: #ffffff;
        }

        body.modo-noturno .menu h2 {
            color: #cccccc;
        }

        body.modo-noturno .menu h3 {
            color: #8bb8f0;
        }

        body.modo-noturno .links a {
            background: #333333;
            color: #ffffff;
        }

        body.modo-noturno .links a:hover {
            background: #24436b;
        }

        body.modo-noturno .botao-tema {
            background: #f0c75e;
            color: #222222;
        }

        @media (max-width: 520px) {
            .menu {
                padding-top: 65px;
            }

            .links {
                flex-direction: column;
            }

            .links a {
                max-width: 100%;
            }
        }
    </style>
</head>

<body>

    <button class="botao-tema" id="botaoTema"
            onclick="alternarTema()" aria-pressed="false">
        🌙 Modo noturno
    </button>

    <nav class="menu">
        <h1>Menu</h1>
        <h2>Projeto Integrador</h2>
        <h3>Sobre nós</h3>

        <div class="links">
            <a href="#gabriel-senger-piana">Gabriel Senger Piana</a>
            <a href="#pedro-geraldi">Pedro Geraldi</a>
            <a href="#lucas-gowert">Lucas Gowert</a>
        </div>
    </nav>

    <script>
        function alternarTema() {
            const corpo = document.body;
            const botao = document.getElementById("botaoTema");

            corpo.classList.toggle("modo-noturno");

            if (corpo.classList.contains("modo-noturno")) {
                botao.innerHTML = "☀️ Modo claro";
                botao.setAttribute("aria-pressed", "true");
            } else {
                botao.innerHTML = "🌙 Modo noturno";
                botao.setAttribute("aria-pressed", "false");
            }
        }
    </script>

</body>
</html>
