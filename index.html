
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu - Projeto Integrador</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f1f5f1;
            color: #303b33;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background-color 0.3s, color 0.3s;
        }

        .menu {
            background-color: white;
            width: 90%;
            max-width: 650px;
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            transition: background-color 0.3s;
        }

        h1 {
            margin-bottom: 20px;
        }

        h2 {
            margin-bottom: 15px;
        }

        p {
            margin-bottom: 30px;
        }

        .controles {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        button {
            padding: 10px 18px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background-color: #4b7657;
            color: white;
            font-size: 14px;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #365b40;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .links a {
            display: block;
            padding: 15px;
            background-color: #e3eee4;
            color: #303b33;
            text-decoration: none;
            border-radius: 8px;
            transition: background-color 0.3s, transform 0.2s;
        }

        .links a:hover {
            background-color: #c8ddcb;
            transform: scale(1.02);
        }

        /* Modo noturno */
        body.modo-noturno {
            background-color: #202820;
            color: #e8eee8;
        }

        body.modo-noturno .menu {
            background-color: #303b33;
        }

        body.modo-noturno .links a {
            background-color: #465749;
            color: #f1f5f1;
        }

        body.modo-noturno .links a:hover {
            background-color: #58715d;
        }

        @media (max-width: 520px) {
            .menu {
                padding: 25px;
            }

            .controles {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

    <div class="menu">

        <h1>Menu</h1>

        <div class="controles">
            <button id="botaoTema" onclick="alternarTema()" aria-pressed="false">
                🌙 Modo Noturno
            </button>

            <button id="botaoIdioma" onclick="alternarIdioma()">
                🇺🇸 English
            </button>
        </div>

        <h2 id="tituloProjeto">Projeto Integrador</h2>

        <p id="sobreProjeto">Sobre nós</p>

        <div class="links">
            <a href="gabb.html">Gabriel Senger Piana</a>
            <a href="#pedro-geraldi">Pedro Geraldi</a>
            <a href="lucas.html">Lucas Gowert</a>
            <a href="cronicasgowert.html">Crônicas Gowert</a>
        </div>

    </div>

    <script>
        let modoNoturno = false;
        let idiomaIngles = false;

        function alternarTema() {
            modoNoturno = !modoNoturno;

            document.body.classList.toggle("modo-noturno", modoNoturno);

            const botaoTema = document.getElementById("botaoTema");

            if (modoNoturno) {
                botaoTema.innerHTML = idiomaIngles
                    ? "☀️ Light Mode"
                    : "☀️ Modo Claro";
            } else {
                botaoTema.innerHTML = idiomaIngles
                    ? "🌙 Dark Mode"
                    : "🌙 Modo Noturno";
            }

            botaoTema.setAttribute("aria-pressed", modoNoturno);
        }

        function alternarIdioma() {
            idiomaIngles = !idiomaIngles;

            const botaoIdioma = document.getElementById("botaoIdioma");
            const tituloProjeto = document.getElementById("tituloProjeto");
            const sobreProjeto = document.getElementById("sobreProjeto");
            const botaoTema = document.getElementById("botaoTema");

            if (idiomaIngles) {
                document.documentElement.lang = "en";

                document.title = "Menu - Integrator Project";
                tituloProjeto.innerHTML = "Integrator Project";
                sobreProjeto.innerHTML = "About Us";

                botaoIdioma.innerHTML = "🇧🇷 Português";

                botaoTema.innerHTML = modoNoturno
                    ? "☀️ Light Mode"
                    : "🌙 Dark Mode";

            } else {
                document.documentElement.lang = "pt-BR";

                document.title = "Menu - Projeto Integrador";
                tituloProjeto.innerHTML = "Projeto Integrador";
                sobreProjeto.innerHTML = "Sobre nós";

                botaoIdioma.innerHTML = "🇺🇸 English";

                botaoTema.innerHTML = modoNoturno
                    ? "☀️ Modo Claro"
                    : "🌙 Modo Noturno";
            }
        }
    </script>

</body>
</html>
